# Violin Coach: a static site, so there is no state, no secret and nothing to scale.

replicaCount: 1

image:
  repository: ghcr.io/benjamindebotte/violin
  pullPolicy: IfNotPresent
  # Defaults to the chart appVersion. Pin it from the deployment (GitOps) values.
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

# nginx-unprivileged runs as uid/gid 101 and listens on 8080
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 101
  runAsGroup: 101
  fsGroup: 101
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

# The microphone only works on https:// (or localhost), so serve this behind TLS.
ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: violin.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []

# Shared score library: nginx stores the files under /srv/library so every device sees them.
library:
  persistence:
    # Name of an existing PersistentVolumeClaim. Empty = an emptyDir (the files are lost on restart).
    existingClaim: ""
    # Folder inside the volume (created when missing)
    subPath: ""
  # A second Ingress for /library only, so a login middleware can protect the library
  # while the app itself stays open (a PWA must fetch its manifest without a login redirect).
  ingress:
    enabled: false
    annotations: {}
    path: /library

resources:
  requests:
    cpu: 10m
    memory: 16Mi
  limits:
    cpu: 100m
    memory: 64Mi

livenessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 3
  periodSeconds: 20

readinessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 2
  periodSeconds: 10

nodeSelector: {}
tolerations: []
affinity: {}
