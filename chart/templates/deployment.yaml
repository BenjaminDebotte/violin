{{- if .Values.library.enabled }}
  {{- if not .Values.library.persistence.existingClaim }}
    {{- fail "library.enabled=true requires library.persistence.existingClaim to be set" }}
  {{- end }}
  {{- if not .Values.ingress.enabled }}
    {{- fail "library.enabled=true requires ingress.enabled=true" }}
  {{- end }}
  {{- if not .Values.library.ingress.enabled }}
    {{- fail "library.enabled=true requires library.ingress.enabled=true" }}
  {{- end }}
  {{- if not .Values.library.ingress.annotations }}
    {{- fail "library.enabled=true requires library.ingress.annotations to be set" }}
  {{- end }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "violin.fullname" . }}
  labels:
    {{- include "violin.labels" . | nindent 4 }}
spec:
  {{- if and .Values.library.enabled .Values.library.persistence.existingClaim }}
  strategy:
    type: Recreate
  {{- end }}
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "violin.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "violin.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "violin.serviceAccountName" . }}
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
              protocol: TCP
            {{- if .Values.library.enabled }}
            - name: library
              containerPort: {{ .Values.service.libraryTargetPort | default 8081 }}
              protocol: TCP
            {{- end }}
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          # nginx keeps its pid file and upload buffers in /tmp; the rest of the filesystem is read-only
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- if .Values.library.enabled }}
            - name: library
              mountPath: /srv/library
              {{- with .Values.library.persistence.subPath }}
              subPath: {{ . | quote }}
              {{- end }}
            {{- end }}
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
        {{- if and .Values.library.enabled .Values.library.persistence.existingClaim }}
        - name: library
          persistentVolumeClaim:
            claimName: {{ .Values.library.persistence.existingClaim }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
