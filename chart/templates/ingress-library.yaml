{{- if and .Values.library.enabled .Values.ingress.enabled .Values.library.ingress.enabled -}}
{{- $fullName := include "violin.fullname" . -}}
{{- $libPort := .Values.service.libraryPort | default 8081 -}}
{{- $path := .Values.library.ingress.path -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $fullName }}-library
  labels:
    {{- include "violin.labels" . | nindent 4 }}
  {{- with .Values.library.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  {{- if .Values.ingress.tls }}
  tls:
    {{- range .Values.ingress.tls }}
    - hosts:
        {{- range .hosts }}
        - {{ . | quote }}
        {{- end }}
      secretName: {{ .secretName }}
    {{- end }}
  {{- end }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          # The longer path wins over "/" in Traefik, so only /library goes through this Ingress
          - path: {{ $path }}
            pathType: Prefix
            backend:
              service:
                name: {{ $fullName }}
                port:
                  number: {{ $libPort }}
    {{- end }}
{{- end }}
