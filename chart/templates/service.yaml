apiVersion: v1
kind: Service
metadata:
  name: {{ include "violin.fullname" . }}
  labels:
    {{- include "violin.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
    {{- if .Values.library.enabled }}
    - port: {{ .Values.service.libraryPort | default 8081 }}
      targetPort: library
      protocol: TCP
      name: library
    {{- end }}
  selector:
    {{- include "violin.selectorLabels" . | nindent 4 }}
