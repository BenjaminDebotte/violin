{{- if .Values.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "violin.serviceAccountName" . }}
  labels:
    {{- include "violin.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# A static site never talks to the Kubernetes API
automountServiceAccountToken: false
{{- end }}
