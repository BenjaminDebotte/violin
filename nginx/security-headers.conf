# Included in every location: nginx drops server-level add_header as soon as a location adds its own.
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
# The microphone is the point of the app: allow it for this origin only, nothing else.
add_header Permissions-Policy "microphone=(self), camera=(), geolocation=(), payment=(), usb=()" always;
