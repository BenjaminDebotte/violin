# Shared library: score files stored on a mounted volume so every device sees the same scores.
# Not public: the cluster puts the authentication middleware in front of /library, and the
# checks below keep the endpoint narrow even for a signed-in user.

# 1 when a write or delete targets anything but a plain MusicXML file name
map "$request_method $uri" $library_write_denied {
    default 0;
    "~^(PUT|DELETE) (?!/library/files/[A-Za-z0-9][A-Za-z0-9._()-]{0,100}\.(musicxml|mxl|xml)$)" 1;
}

# 1 when a write or delete lacks the custom header. A page on another site cannot add it
# without a CORS preflight, which this server never grants, so cross-site forgery is blocked.
map "$request_method $http_x_violin_library" $library_csrf_denied {
    default 0;
    "~^(PUT|DELETE) $" 1;
}

server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml text/xml application/xml;

    # Liveness / readiness probe target (no access log noise)
    location = /healthz {
        access_log off;
        default_type text/plain;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-store";
        return 200 "ok\n";
    }

    # Signing in lands here (the middleware redirects back to the page that was asked for)
    location = /library { return 302 /; }
    location = /library/ { return 302 /; }

    # JSON listing (GET /library/files/) and the files themselves; PUT adds, DELETE removes
    location /library/files/ {
        alias /srv/library/;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-store";
        default_type application/xml; # .musicxml / .mxl are not in the mime table

        limit_except GET HEAD PUT DELETE { deny all; }
        if ($library_write_denied) { return 403; }
        if ($library_csrf_denied) { return 403; }

        autoindex on;
        autoindex_format json;
        dav_methods PUT DELETE;
        dav_access user:rw group:rw all:r;
        create_full_put_path off;
        client_max_body_size 10m;
    }

    # Fingerprinted build output: safe to cache for a year
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # The PWA manifest is not in nginx's mime table, and browsers ignore it without this type
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Files that must always be revalidated so a new release is picked up
    location ~ ^/(index\.html|sw\.js|registerSW\.js|workbox-[^/]+\.js)$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Self-hosted font and sample scores: stable, but not fingerprinted
    location ~ ^/(fonts|samples)/ {
        default_type application/xml; # .musicxml is not in the mime table
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    # Single-page app: unknown paths fall back to the shell
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
